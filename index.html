<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Persianas RA</title>
  
  <!-- Configuracoes PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#25D366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Persianas RA">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1033/1033923.png">

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    /* Video da Câmera */
    #videoCam {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Tela de Arraste da Persiana */
    .ar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Persiana Movel */
    .persiana-container {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 250px;
      transition: width 0.2s;
      pointer-events: auto;
      cursor: grab;
    }
    .persiana-container:active { cursor: grabbing; }

    .bando { width: 100%; height: 18px; background: #333; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
    .tecido {
      width: 96%;
      margin: 0 auto;
      height: 250px;
      background-color: #ffffff;
      opacity: 0.85;
      transition: height 0.6s ease-in-out, background-color 0.4s, opacity 0.4s, width 0.2s;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .barra-peso { width: 98%; margin: 0 auto; height: 8px; background: #222; border-radius: 2px; }

    /* Painel Inferior de Vendas */
    .painel-vendas {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      width: 92%;
      max-width: 420px;
      backdrop-filter: blur(8px);
    }

    .controles-linha {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .grupo-input { flex: 1; }
    .grupo-input label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-bottom: 2px; }
    .grupo-input input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .botoes-modelo {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: #f8f9fa;
      font-size: 11px;
    }
    .btn.ativo { border-color: #007bff; background: #e7f1ff; color: #007bff; }
    
    /* Opcionais/Acessórios */
    .opcionais-box {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: bold;
      color: #444;
      background: #f1f3f5;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .opcionais-box label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .resumo-orcamento {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .resumo-orcamento p { margin: 0; font-size: 11px; color: #444; }
    .preco-total { font-size: 17px; font-weight: bold; color: #28a745; }

    .btn-wsp {
      background: #25D366;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Câmera do Dispositivo -->
  <video id="videoCam" autoplay playsinline></video>

  <!-- Persiana Movel sobre a Câmera -->
  <div class="ar-overlay">
    <div class="persiana-container" id="persianaBox">
      <div class="bando"></div>
      <div id="tecido" class="tecido"></div>
      <div class="barra-peso"></div>
    </div>
  </div>

  <!-- Controles da Aplicação -->
  <div class="painel-vendas">
    
    <!-- Opções de Tecido -->
    <div class="botoes-modelo">
      <button class="btn ativo" onclick="selecionarModelo('#ffffff', 0.85, 120, 'Tela Solar 3%', this)">Tela Solar</button>
      <button class="btn" onclick="selecionarModelo('#d7c4b7', 0.90, 140, 'Bege Trans.', this)">Bege</button>
      <button class="btn" onclick="selecionarModelo('#1a1a1a', 1.0, 180, 'Blackout', this)">Blackout</button>
    </div>

    <!-- Ajuste de Dimensões -->
    <div class="controles-linha">
      <div class="grupo-input">
        <label>Largura (m):</label>
        <input type="number" id="largura" value="1.50" step="0.10" min="0.5" max="3.0" oninput="calcularValores()">
      </div>
      <div class="grupo-input">
        <label>Altura (m):</label>
        <input type="number" id="altura" value="2.00" step="0.10" min="0.5" max="3.0" oninput="calcularValores()">
      </div>
      <div class="grupo-input" style="display: flex; align-items: flex-end;">
        <button class="btn" style="width: 100%; height: 30px;" onclick="alternarPersiana()">Abrir/Fechar</button>
      </div>
    </div>

    <!-- Acessórios Opcionais -->
    <div class="opcionais-box">
      <label><input type="checkbox" id="chkBando" onchange="calcularValores()"> Bandô (+R$40/m)</label>
      <label><input type="checkbox" id="chkMotor" onchange="calcularValores()"> Motorização (+R$350)</label>
    </div>

    <!-- Resumo Comercial -->
    <div class="resumo-orcamento">
      <div>
        <p>Modelo: <strong id="txtModelo">Tela Solar 3%</strong></p>
        <p>Área: <strong id="txtArea">3.00 m²</strong></p>
      </div>
      <div class="preco-total" id="txtTotal">R$ 360,00</div>
    </div>

    <button class="btn-wsp" onclick="enviarWhatsApp()">
      Enviar Orçamento no WhatsApp
    </button>
  </div>

  <script>
    let aberta = false;
    let precoM2Atual = 120;
    let nomeModeloAtual = "Tela Solar 3%";

    // Iniciar Câmera ao vivo
    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" } 
        });
        document.getElementById('videoCam').srcObject = stream;
      } catch (err) {
        console.error("Erro na câmera: ", err);
      }
    }

    function selecionarModelo(cor, opacidade, precoM2, nome, elemento) {
      const tecido = document.getElementById('tecido');
      tecido.style.backgroundColor = cor;
      tecido.style.opacity = opacidade;

      precoM2Atual = precoM2;
      nomeModeloAtual = nome;
      document.getElementById('txtModelo').innerText = nome;

      document.querySelectorAll('.botoes-modelo .btn').forEach(b => b.classList.remove('ativo'));
      elemento.classList.add('ativo');

      calcularValores();
    }

    function calcularValores() {
      const largura = parseFloat(document.getElementById('largura').value) || 0;
      const altura = parseFloat(document.getElementById('altura').value) || 0;

      const areaReal = largura * altura;
      const areaFaturada = Math.max(areaReal, 1.5); 
      let total = areaFaturada * precoM2Atual;

      if (document.getElementById('chkBando').checked) {
        total += largura * 40;
      }
      if (document.getElementById('chkMotor').checked) {
        total += 350;
      }

      document.getElementById('txtArea').innerText = areaReal.toFixed(2) + " m²";
      document.getElementById('txtTotal').innerText = "R$ " + total.toFixed(2).replace('.', ',');

      const persianaBox = document.getElementById('persianaBox');
      const larguraPx = Math.min(Math.max(largura * 140, 140), 340);
      persianaBox.style.width = larguraPx + "px";
    }

    function alternarPersiana() {
      const tecido = document.getElementById('tecido');
      if (!aberta) {
        tecido.style.height = '20px';
        aberta = true;
      } else {
        tecido.style.height = '250px';
        aberta = false;
      }
    }

    // Arraste Touch e Mouse
    const el = document.getElementById('persianaBox');
    let isDragging = false, currentX = 0, currentY = 0, initialX = 0, initialY = 0, xOffset = 0, yOffset = 0;

    el.addEventListener("touchstart", dragStart, false);
    el.addEventListener("touchend", dragEnd, false);
    el.addEventListener("touchmove", drag, false);
    el.addEventListener("mousedown", dragStart, false);
    el.addEventListener("mouseup", dragEnd, false);
    el.addEventListener("mousemove", drag, false);

    function dragStart(e) {
      if (e.type === "touchstart") {
        initialX = e.touches[0].clientX - xOffset;
        initialY = e.touches[0].clientY - yOffset;
      } else {
        initialX = e.clientX - xOffset;
        initialY = e.clientY - yOffset;
      }
      if (e.target.closest('#persianaBox')) isDragging = true;
    }

    function dragEnd() {
      initialX = currentX; initialY = currentY;
      isDragging = false;
    }

    function drag(e) {
      if (isDragging) {
        e.preventDefault();
        if (e.type === "touchmove") {
          currentX = e.touches[0].clientX - initialX;
          currentY = e.touches[0].clientY - initialY;
        } else {
          currentX = e.clientX - initialX;
          currentY = e.clientY - initialY;
        }
        xOffset = currentX; yOffset = currentY;
        el.style.transform = `translate(calc(-50% + ${currentX}px), ${currentY}px)`;
      }
    }

    // Envio WhatsApp
    function enviarWhatsApp() {
      const largura = document.getElementById('largura').value;
      const altura = document.getElementById('altura').value;
      const area = document.getElementById('txtArea').innerText;
      const total = document.getElementById('txtTotal').innerText;
      
      let adicionais = [];
      if (document.getElementById('chkBando').checked) adicionais.push("Bandô");
      if (document.getElementById('chkMotor').checked) adicionais.push("Motorização");
      const textoAdicionais = adicionais.length > 0 ? adicionais.join(", ") : "Nenhum";

      const mensagem = `Olá! Segue o orçamento da sua persiana:%0A%0A` +
        `📌 *Modelo:* ${nomeModeloAtual}%0A` +
        `📐 *Medidas:* ${largura}m x ${altura}m (${area})%0A` +
        `⚙️ *Opcionais:* ${textoAdicionais}%0A` +
        `💰 *Valor Total:* ${total}%0A%0A` +
        `Orçamento gerado pelo Simulador RA da loja.`;

      window.open(`https://api.whatsapp.com/send?text=${mensagem}`, '_blank');
    }

    // Registro do Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA Service Worker registrado!'))
          .catch(err => console.log('Falha no PWA:', err));
      });
    }

    // Inicialização
    iniciarCamera();
    calcularValores();
  </script>

</body>
</html>
