<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Persianas RA</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    /* Video da Câmera em Tempo Real */
    #videoCam {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Area de Sobreposição da Persiana Virtual */
    .ar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Deixa interagir com o fundo */
    }

    .persiana-container {
      position: absolute;
      top: 20%;
      width: 250px;
      transition: width 0.3s;
      pointer-events: auto;
    }
    .bando { width: 100%; height: 18px; background: #333; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
    .tecido {
      width: 96%;
      margin: 0 auto;
      height: 300px;
      background-color: #ffffff;
      opacity: 0.85;
      transition: height 0.8s ease-in-out, background-color 0.4s, opacity 0.4s, width 0.3s;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .barra-peso { width: 98%; margin: 0 auto; height: 8px; background: #222; border-radius: 2px; }

    /* Painel de Vendas Inferior Flutuante */
    .painel-vendas {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(5px);
    }

    .controles-linha {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .grupo-input { flex: 1; }
    .grupo-input label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-bottom: 3px; }
    .grupo-input input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .botoes-modelo {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: #f8f9fa;
      font-size: 11px;
    }
    .btn.ativo { border-color: #007bff; background: #e7f1ff; color: #007bff; }
    .btn-action { background: #28a745; color: #fff; border: none; width: 100%; font-size: 13px; margin-top: 6px; }

    .resumo-orcamento {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f3f5;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .resumo-orcamento p { margin: 0; font-size: 12px; color: #444; }
    .preco-total { font-size: 16px; font-weight: bold; color: #28a745; }
  </style>
</head>
<body>

  <!-- Câmera do Dispositivo -->
  <video id="videoCam" autoplay playsinline></video>

  <!-- Camada da Persiana sobreposta -->
  <div class="ar-overlay">
    <div class="persiana-container" id="persianaBox">
      <div class="bando"></div>
      <div id="tecido" class="tecido"></div>
      <div class="barra-peso"></div>
    </div>
  </div>

  <!-- Controles da Aplicação -->
  <div class="painel-vendas">
    
    <!-- Opções de Tecido -->
    <div class="botoes-modelo">
      <button class="btn ativo" onclick="selecionarModelo('#ffffff', 0.85, 120, 'Tela Solar 3%', this)">Tela Solar</button>
      <button class="btn" onclick="selecionarModelo('#d7c4b7', 0.90, 140, 'Bege Trans.', this)">Bege</button>
      <button class="btn" onclick="selecionarModelo('#1a1a1a', 1.0, 180, 'Blackout', this)">Blackout</button>
    </div>

    <!-- Ajuste de Dimensões -->
    <div class="controles-linha">
      <div class="grupo-input">
        <label>Largura (m):</label>
        <input type="number" id="largura" value="1.50" step="0.10" min="0.5" max="3.0" oninput="calcularValores()">
      </div>
      <div class="grupo-input">
        <label>Altura (m):</label>
        <input type="number" id="altura" value="2.00" step="0.10" min="0.5" max="3.0" oninput="calcularValores()">
      </div>
      <div class="grupo-input" style="display: flex; align-items: flex-end;">
        <button class="btn" style="width: 100%; height: 31px;" onclick="alternarPersiana()">Abrir/Fechar</button>
      </div>
    </div>

    <!-- Resumo Comercial -->
    <div class="resumo-orcamento">
      <div>
        <p>Modelo: <strong id="txtModelo">Tela Solar 3%</strong></p>
        <p>Área: <strong id="txtArea">3.00 m²</strong></p>
      </div>
      <div class="preco-total" id="txtTotal">R$ 360,00</div>
    </div>

    <button class="btn btn-action" onclick="alert('Orçamento gerado para envio!')">Gerar Proposta PDF</button>
  </div>

  <script>
    let aberta = false;
    let precoM2Atual = 120;
    let nomeModeloAtual = "Tela Solar 3%";

    // Iniciar Câmera do Dispositivo
    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" } // Prioriza câmera traseira no celular
        });
        const video = document.getElementById('videoCam');
        video.srcObject = stream;
      } catch (err) {
        console.error("Erro ao acessar a câmera: ", err);
        alert("Não foi possível acessar a câmera ou a permissão foi negada.");
      }
    }

    function selecionarModelo(cor, opacidade, precoM2, nome, elemento) {
      const tecido = document.getElementById('tecido');
      tecido.style.backgroundColor = cor;
      tecido.style.opacity = opacidade;

      precoM2Atual = precoM2;
      nomeModeloAtual = nome;
      document.getElementById('txtModelo').innerText = nome;

      document.querySelectorAll('.botoes-modelo .btn').forEach(b => b.classList.remove('ativo'));
      elemento.classList.add('ativo');

      calcularValores();
    }

    function calcularValores() {
      const largura = parseFloat(document.getElementById('largura').value) || 0;
      const altura = parseFloat(document.getElementById('altura').value) || 0;

      const areaReal = largura * altura;
      const areaFaturada = Math.max(areaReal, 1.5); 
      const total = areaFaturada * precoM2Atual;

      document.getElementById('txtArea').innerText = areaReal.toFixed(2) + " m²";
      document.getElementById('txtTotal').innerText = "R$ " + total.toFixed(2).replace('.', ',');

      const persianaBox = document.getElementById('persianaBox');
      const larguraPx = Math.min(Math.max(largura * 150, 150), 340);
      persianaBox.style.width = larguraPx + "px";
    }

    function alternarPersiana() {
      const tecido = document.getElementById('tecido');
      if (!aberta) {
        tecido.style.height = '30px';
        aberta = true;
      } else {
        tecido.style.height = '300px';
        aberta = false;
      }
    }

    // Inicialização
    iniciarCamera();
    calcularValores();
  </script>

</body>
</html>
