<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizora - Simulador 3D & Orçamento de Persianas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js CDN para renderização 3D WebGL leve -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col select-none">

  <!-- Header -->
  <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">V</div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Vizora <span class="text-xs font-normal text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">Simulador & Câmera 3D</span></h1>
    </div>
    <button onclick="gerarQRCodeProposta()" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg font-medium hover:bg-slate-800 transition">
      Gerar QR Code
    </button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Area do Simulador / Visualizador -->
    <div class="lg:col-span-2 flex flex-col gap-4">
      
      <!-- Seletor de Modo -->
      <div class="flex flex-wrap gap-2 p-1 bg-slate-200/80 rounded-xl w-fit text-sm font-medium">
        <button id="btn-mode-3d-webgl" onclick="alterarModo('3d-webgl')" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-slate-900 transition">📷 Projetar 3D na Câmera</button>
        <button id="btn-mode-2d" onclick="alterarModo('2d')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">Simular sobre Foto</button>
      </div>

      <!-- Modo 1: Projeção 3D com Câmera ao Fundo em Tempo Real -->
      <div id="container-3d-webgl" class="flex flex-col gap-4">
        <!-- Caixa de Visualização 3D/Câmera 100% Limpa -->
        <div class="relative w-full h-[380px] md:h-[460px] bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
          <video id="camera-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>
          <div id="canvas-webgl-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-10"></div>
        </div>

        <!-- PAINEL DE CONTROLOS EXTERNO E SEPARADO (Abaixo da caixa) -->
        <div class="glass-panel p-4 rounded-2xl shadow-sm flex flex-col gap-3 text-xs font-medium text-slate-700">
          <div class="flex items-center gap-3 w-full">
            <span class="whitespace-nowrap font-semibold">Rolô (Abrir/Fechar):</span>
            <input type="range" id="slider-abertura" min="0" max="100" value="0" oninput="atualizarAberturaPersiana(this.value)" class="w-full accent-indigo-600 cursor-pointer h-2 bg-slate-200 rounded-lg" />
            <span id="txt-abertura-val" class="font-bold text-indigo-600 min-w-[35px] text-right">100%</span>
          </div>
          <div class="flex flex-wrap gap-2 justify-end pt-2 border-t border-slate-200/60">
            <button id="btn-toggle-camera" onclick="alternarCamera()" class="flex-1 bg-indigo-600 text-white px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition font-semibold shadow-sm">Ligar Câmera</button>
            <button onclick="resetarCamera3D()" class="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl hover:bg-slate-300 transition font-semibold">Centralizar 3D</button>
          </div>
        </div>
      </div>

      <!-- Modo 2: Simulação Visual sobre Foto da Janela -->
      <div id="container-2d" class="hidden flex flex-col gap-4">
        <div class="relative w-full h-[380px] md:h-[460px] bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
          <canvas id="canvas-2d" class="w-full h-full touch-none cursor-crosshair"></canvas>
        </div>

        <div class="glass-panel p-4 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3 text-xs font-medium text-slate-700">
          <span id="txt-instrucao" class="text-center sm:text-left">Carregue uma foto da janela e ajuste as medidas reais na trena.</span>
          <div class="flex gap-2 w-full sm:w-auto justify-end">
            <label class="flex-1 sm:flex-initial text-center bg-indigo-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-indigo-700 transition font-semibold">
              Carregar Foto
              <input type="file" accept="image/*" capture="environment" onchange="carregarImagem(event)" class="hidden" />
            </label>
            <button onclick="resetarPontos()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-300 transition font-semibold">Limpar Foto</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Painel de Configurações & Orçamento Exato -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col justify-between gap-6">
      <div class="space-y-6">
        <h2 class="text-lg font-bold text-slate-900 border-b border-slate-200/80 pb-3">Inserir Medidas Reais (Trena)</h2>
        
        <!-- Medidas Manuais -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Largura (m)</label>
            <input type="number" id="input-largura" value="1.50" step="0.01" min="0.1" oninput="atualizarCalculos(); atualizarModelo3D();" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800 font-medium" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Altura (m)</label>
            <input type="number" id="input-altura" value="1.80" step="0.01" min="0.1" oninput="atualizarCalculos(); atualizarModelo3D();" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800 font-medium" />
          </div>
        </div>

        <!-- Tipo de Tecido -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Modelo / Tecido</label>
          <select id="select-tecido" onchange="atualizarCalculos(); atualizarModelo3D();" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-800 font-medium">
            <option value="120" data-color="#1e293b">Rolô Blackout (R$ 120/m²)</option>
            <option value="95" data-color="#f8fafc">Rolô Tela Solar 3% (R$ 95/m²)</option>
            <option value="150" data-color="#94a3b8">Persiana Horizontal Alumínio (R$ 150/m²)</option>
            <option value="210" data-color="#d97706">Double Vision / Romana (R$ 210/m²)</option>
          </select>
        </div>

        <!-- Resumo do Cálculo -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2">
          <div class="flex justify-between text-sm text-slate-600">
            <span>Área Total:</span>
            <span id="txt-area" class="font-semibold text-slate-800">2.70 m²</span>
          </div>
          <div class="flex justify-between text-base font-bold text-slate-900 border-t border-slate-200/60 pt-2">
            <span>Valor do Orçamento:</span>
            <span id="txt-preco" class="text-indigo-600">R$ 324,00</span>
          </div>
        </div>
      </div>

      <!-- Botão WhatsApp -->
      <button onclick="enviarOrcamentoWhatsApp()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
        Enviar Orçamento via WhatsApp
      </button>
    </div>

  </main>

  <!-- Modal do QR Code -->
  <div id="modal-qrcode" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900">Proposta / QR Code</h3>
      <p class="text-xs text-slate-500">Escaneie para carregar este orçamento e medidas no celular.</p>
      
      <div id="qrcode-target" class="flex justify-center py-2"></div>

      <button onclick="fecharModalQRCode()" class="w-full py-2 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition text-sm">
        Fechar
      </button>
    </div>
  </div>

  <script>
    const SEU_NUMERO_WHATSAPP = "5522999633486";
    let imagemCarregada = null;
    let streamCamera = null;
    const canvas = document.getElementById('canvas-2d');
    const ctx = canvas.getContext('2d');

    // Variáveis do motor Three.js WebGL
    let scene, camera, renderer, controls, persianaGroup, tecidoMesh, pesoMesh;
    let percentualAbertura = 0;

    function init3DWebGL() {
      const container = document.getElementById('canvas-webgl-container');
      const width = container.clientWidth || 300;
      const height = container.clientHeight || 400;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 0, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      dirLight.castShadow = true;
      scene.add(dirLight);

      persianaGroup = new THREE.Group();

      // Trilho Superior
      const trilhoGeo = new THREE.BoxGeometry(1.6, 0.08, 0.1);
      const trilhoMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
      const trilhoMesh = new THREE.Mesh(trilhoGeo, trilhoMat);
      trilhoMesh.position.y = 0.9;
      persianaGroup.add(trilhoMesh);

      // Tecido
      const tecidoGeo = new THREE.PlaneGeometry(1.5, 1.8);
      const tecidoMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, side: THREE.DoubleSide, roughness: 0.6 });
      tecidoMesh = new THREE.Mesh(tecidoGeo, tecidoMat);
      tecidoMesh.position.y = 0;
      persianaGroup.add(tecidoMesh);

      // Barra Inferior (Peso)
      const pesoGeo = new THREE.BoxGeometry(1.52, 0.04, 0.04);
      pesoMesh = new THREE.Mesh(pesoGeo, trilhoMat);
      pesoMesh.position.y = -0.9;
      persianaGroup.add(pesoMesh);

      scene.add(persianaGroup);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    async function alternarCamera() {
      const video = document.getElementById('camera-video');
      const btn = document.getElementById('btn-toggle-camera');

      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
        video.classList.add('hidden');
        btn.innerText = "Ligar Câmera";
        btn.className = "flex-1 bg-indigo-600 text-white px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition font-semibold shadow-sm";
      } else {
        try {
          streamCamera = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
          });
        } catch (e) {
          try {
            streamCamera = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          } catch (err) {
            alert("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
            return;
          }
        }
        video.srcObject = streamCamera;
        video.classList.remove('hidden');
        btn.innerText = "Desligar Câmera";
        btn.className = "flex-1 bg-rose-600 text-white px-4 py-2.5 rounded-xl hover:bg-rose-700 transition font-semibold shadow-sm";
      }
    }

    function atualizarAberturaPersiana(val) {
      percentualAbertura = parseFloat(val);
      const porcentagemFechada = (100 - percentualAbertura) / 100;
      document.getElementById('txt-abertura-val').innerText = `${Math.round(porcentagemFechada * 100)}%`;

      if (tecidoMesh && pesoMesh) {
        const alturaBase = 1.8;
        const novaAlturaGeo = Math.max(0.05, alturaBase * porcentagemFechada);

        tecidoMesh.scale.y = Math.max(0.02, porcentagemFechada);
        tecidoMesh.position.y = 0.9 - (novaAlturaGeo / 2);
        pesoMesh.position.y = 0.9 - novaAlturaGeo;
      }
    }

    function resetarCamera3D() {
      if (controls) {
        camera.position.set(0, 0, 4);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    }

    function atualizarModelo3D() {
      if (!persianaGroup) return;
      const largura = parseFloat(document.getElementById('input-largura').value) || 1.5;
      const altura = parseFloat(document.getElementById('input-altura').value) || 1.8;
      
      const select = document.getElementById('select-tecido');
      const corHex = select.options[select.selectedIndex].getAttribute('data-color') || '#1e293b';

      persianaGroup.scale.x = largura / 1.5;
      if (tecidoMesh) {
        tecidoMesh.material.color.set(corHex);
      }
      atualizarAberturaPersiana(percentualAbertura);
      desenharCanvas();
    }

    function alterarModo(modo) {
      const c3dWebgl = document.getElementById('container-3d-webgl');
      const c2d = document.getElementById('container-2d');

      const btnWebgl = document.getElementById('btn-mode-3d-webgl');
      const btn2d = document.getElementById('btn-mode-2d');

      c3dWebgl.classList.add('hidden');
      c2d.classList.add('hidden');

      btnWebgl.className = 'px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
      btn2d.className = 'px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition';

      if (modo === '3d-webgl') {
        c3dWebgl.classList.remove('hidden');
        btnWebgl.className = 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-slate-900 transition';
        if (renderer && controls) {
          const container = document.getElementById('canvas-webgl-container');
          renderer.setSize(container.clientWidth, container.clientHeight);
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
        }
      } else if (modo === '2d') {
        c2d.classList.remove('hidden');
        btn2d.className = 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-slate-900 transition';
        redimensionarCanvas();
      }
    }

    function redimensionarCanvas() {
      const container = document.getElementById('container-2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      desenharCanvas();
    }

    function carregarImagem(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          imagemCarregada = img;
          desenharCanvas();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetarPontos() {
      imagemCarregada = null;
      desenharCanvas();
    }

    function desenharCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (imagemCarregada) {
        ctx.drawImage(imagemCarregada, 0, 0, canvas.width, canvas.height);
        
        const largura = parseFloat(document.getElementById('input-largura').value) || 1.5;
        const altura = parseFloat(document.getElementById('input-altura').value) || 1.8;
        
        const boxW = Math.min(canvas.width * 0.7, (largura / 2.5) * canvas.width * 0.5);
        const boxH = Math.min(canvas.height * 0.7, (altura / 2.5) * canvas.height * 0.5);
        const startX = (canvas.width - boxW) / 2;
        const startY = (canvas.height - boxH) / 2;

        ctx.fillStyle = "rgba(79, 70, 229, 0.35)";
        ctx.fillRect(startX, startY, boxW, boxH);
        ctx.strokeStyle = "#4f46e5";
        ctx.lineWidth = 3;
        ctx.strokeRect(startX, startY, boxW, boxH);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`Persiana: ${largura.toFixed(2)}m x ${altura.toFixed(2)}m`, canvas.width / 2, startY + boxH / 2);
      } else {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Toque em 'Carregar Foto' abaixo para colocar a imagem da janela", canvas.width / 2, canvas.height / 2);
      }
    }

    function atualizarCalculos() {
      const largura = parseFloat(document.getElementById('input-largura').value) || 0;
      const altura = parseFloat(document.getElementById('input-altura').value) || 0;
      const precoMetro = parseFloat(document.getElementById('select-tecido').value) || 0;

      const area = largura * altura;
      const total = area * precoMetro;

      document.getElementById('txt-area').innerText = `${area.toFixed(2)} m²`;
      document.getElementById('txt-preco').innerText = `R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
    }

    function enviarOrcamentoWhatsApp() {
      const largura = document.getElementById('input-largura').value;
      const altura = document.getElementById('input-altura').value;
      const selectTecido = document.getElementById('select-tecido');
      const tecidoNome = selectTecido.options[selectTecido.selectedIndex].text;
      const area = document.getElementById('txt-area').innerText;
      const preco = document.getElementById('txt-preco').innerText;

      const mensagem = `Olá! Gostaria de solicitar um orçamento baseado na simulação do site:%0A%0A` +
        `📏 *Largura (Trena):* ${largura} m%0A` +
        `📐 *Altura (Trena):* ${altura} m%0A` +
        `🎨 *Modelo/Tecido:* ${tecidoNome}%0A` +
        `📊 *Área Total:* ${area}%0A` +
        `💰 *Valor Estimado:* ${preco}`;

      window.open(`https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${mensagem}`, '_blank');
    }

    function gerarQRCodeProposta() {
      const modal = document.getElementById('modal-qrcode');
      const target = document.getElementById('qrcode-target');
      target.innerHTML = '';

      const largura = document.getElementById('input-largura').value;
      const altura = document.getElementById('input-altura').value;
      const url = `${window.location.href}?w=${largura}&h=${altura}`;

      new QRCode(target, { text: url, width: 180, height: 180 });

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function fecharModalQRCode() {
      const modal = document.getElementById('modal-qrcode');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3DWebGL();
      atualizarCalculos();
    });

    window.addEventListener('resize', () => {
      redimensionarCanvas();
      if (renderer && controls) {
        const container = document.getElementById('canvas-webgl-container');
        renderer.setSize(container.clientWidth, container.clientHeight);
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
      }
    });
  </script>
</body>
</html>
